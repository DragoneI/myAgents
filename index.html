<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3338D0">
<title>myAgents | Service en maintenance</title>
<meta name="description" content="Service indisponible en cours de maintenance.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233338D0'/%3E%3Cpath d='M11 9h5.5a7 7 0 0 1 0 14H11z' fill='none' stroke='white' stroke-width='3.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>
  :root {
    --primary:#3338D0; --primary-deep:#23278F; --ink:#1C1E45; --muted:#555A85;
    --paper:#F2F3FB; --soft:#EEF0FB; --line:#E3E5F3;
    --display:'Bricolage Grotesque', system-ui, sans-serif;
    --body:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; height: 100%; }
  body { font-family:var(--body); color:var(--ink); background:var(--primary); font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased; min-height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
  a { color:inherit; text-decoration: none; }
  .wrap { width:100%; max-width:1060px; margin:0 auto; padding:0 22px; }

  /* En-tête */
  .site-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding: 24px 0; }
  .brand { font-family:var(--display); font-weight:800; font-size:22px; letter-spacing:-.02em; color: #fff; }

  /* Contenu de maintenance */
  .maintenance-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 0;
  }
  .maintenance-card {
    background: #fff;
    border-radius: 32px;
    padding: 48px 32px;
    max-width: 560px;
    width: 100%;
    text-align: center;
    box-shadow: 0 24px 60px rgba(15, 10, 60, 0.25);
  }
  .maintenance-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    background: var(--soft);
    border-radius: 20px;
    display: grid;
    place-items: center;
    color: var(--primary);
  }
  .maintenance-icon svg {
    width: 32px;
    height: 32px;
    stroke-width: 2;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(26px, 5vw, 34px);
    line-height: 1.15;
    letter-spacing: -0.03em;
    color: var(--ink);
  }
  p {
    margin-top: 14px;
    color: var(--muted);
    font-size: 17px;
    line-height: 1.5;
  }

  /* Pied de page */
  .foot { padding: 24px 0; font-size: 14px; color: rgba(255,255,255,0.85); text-align: center; }

  @media (min-width: 640px) {
    .maintenance-card { padding: 60px 48px; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <header class="site-head">
      <div class="brand">myAgents</div>
    </header>
  </div>

  <main class="maintenance-container">
    <div class="wrap">
      <div class="maintenance-card">
        <div class="maintenance-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
          </svg>
        </div>
        <h1>Service indisponible en cours de maintenance</h1>
        <p>Nous améliorons actuellement nos systèmes pour vous offrir une meilleure expérience. Nous serons de retour très prochainement.</p>
      </div>
    </div>
  </main>

  <footer class="wrap">
    <div class="foot">
      myAgents, Agadir
    </div>
  </footer>

</body>
</html>
